# On the VPS:  docker compose -f deploy/docker-compose.yml up -d --build
services:
  planner:
    build: ..
    restart: unless-stopped
    environment:
      - SYNC_POLL_MIN=15
      - SYNC_SEAT_REFRESH_MIN=60
    volumes:
      - planner-data:/data
    expose:
      - "8787"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - planner

volumes:
  planner-data:
  caddy-data:
