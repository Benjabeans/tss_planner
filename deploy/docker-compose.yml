# On the VPS:  docker compose -f deploy/docker-compose.yml up -d --build

# Docker keeps container logs forever by default; cap them at 3 × 10 MB per container.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  planner:
    build: ..
    restart: unless-stopped
    environment:
      - SYNC_POLL_MIN=15
      - SYNC_SEAT_REFRESH_MIN=60
    volumes:
      - planner-data:/data
    expose:
      - "8787"
    logging: *logging

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - planner
    logging: *logging

volumes:
  planner-data:
  caddy-data:
